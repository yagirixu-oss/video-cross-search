<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Cross Search — 動画一覧</title>
  <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg">
  <link rel="stylesheet" href="/ui/styles.css">
  <script src="/ui/app.js" defer></script>
</head>
<body>
  <!-- ── サイトの見出し ────────────────────────── -->
  <header class="header">
    <a class="brand" href="/" aria-label="Video Cross Search ホーム"><span class="brand-icon" aria-hidden="true">▶</span> Video Cross Search</a>
    <span class="prototype">授業制作 / PROTOTYPE</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">TWO PLATFORMS, ONE VIEW</p>
      <h1 id="page-title">サイトを越えて、ひとつの一覧へ。</h1>
      <p class="description">YouTubeとニコニコ動画を、同じ画面で。</p>
      <!-- 検索はボタンまたはEnterで実行。入力のたびにはAPIを呼ばない。 -->
      <form id="search-form" class="search-form" role="search">
        <label for="query">動画を検索</label>
        <div class="search-controls">
          <input id="query" name="q" type="search" maxlength="100" required
                 placeholder="例：初音ミク、Blender" aria-describedby="search-help" autocomplete="off">
          <button id="search-submit" type="submit">検索</button>
          <button id="reset" class="secondary" type="button">固定の一覧に戻す</button>
        </div>
        <p id="search-help">1回につき各サイト最大6本。YouTubeは関連度順、ニコニコは再生数順で取得し、交互に表示します。</p>
        <p id="input-error" role="alert" hidden></p>
      </form>
      <div class="sources"><span class="source youtube">YouTube</span><span class="source niconico">ニコニコ動画</span></div>
    </section>
    <!-- ── データの状態と一覧 ─────────────────────── -->
    <section aria-labelledby="list-title">
      <div class="list-heading"><h2 id="list-title"><span id="list-label">動画一覧</span> <span id="count">—</span></h2><span class="sample-label" id="list-mode">公開動画・固定の12本</span></div>
      <p class="notice" id="list-notice">動作確認用に選んだ公開動画です。カードを選ぶと元サイトを開きます。</p>
      <p id="source-summary" class="notice" hidden></p>
      <div id="warnings" class="warnings" role="status" aria-live="polite" hidden></div>
      <div id="status" role="status" aria-live="polite">動画を読み込んでいます…</div>
      <div id="videos" class="video-grid" aria-busy="true"></div>
      <!-- ── 続きの取得：最初から先読みせず、押されたときだけ通信する ── -->
      <div class="pagination">
        <p id="page-status" role="status" aria-live="polite" tabindex="-1"></p>
        <button id="load-more" type="button" aria-controls="videos" hidden>もっと見る</button>
        <button id="retry" type="button" hidden>もう一度読み込む</button>
      </div>
      <noscript><p>動画一覧の表示にはJavaScriptを有効にしてください。</p></noscript>
    </section>
  </main>
  <footer>YouTube / ニコニコ動画 横断表示プロトタイプ</footer>
</body>
</html>
